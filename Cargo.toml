[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"          # matches upstream ArduPilot
repository = "https://github.com/ardupilot/ardupilot"
rust-version = "1.98"

[workspace.dependencies]
# no_std float math. Upstream calls sinf/cosf/atan2f from libm directly
# (AP_Math/ftype.h); std's f32 methods are unavailable in no_std, so we
# depend on the same underlying implementations rather than pulling in std.
libm = "0.2"

ap-math = { path = "crates/ap-math" }
ap-mission = { path = "crates/ap-mission" }
ap-motors = { path = "crates/ap-motors" }
ap-hal = { path = "crates/ap-hal" }
ap-filter = { path = "crates/ap-filter" }
ap-fence = { path = "crates/ap-fence" }
ap-pid = { path = "crates/ap-pid" }
ap-control = { path = "crates/ap-control" }
ap-param = { path = "crates/ap-param" }
ap-rc = { path = "crates/ap-rc" }
ap-nav = { path = "crates/ap-nav" }
ap-plane = { path = "crates/ap-plane" }
ap-servo = { path = "crates/ap-servo" }
ap-ahrs = { path = "crates/ap-ahrs" }
ap-arming = { path = "crates/ap-arming" }
ap-autotune = { path = "crates/ap-autotune" }
ap-airspeed = { path = "crates/ap-airspeed" }
ap-baro = { path = "crates/ap-baro" }
ap-compass = { path = "crates/ap-compass" }
ap-common = { path = "crates/ap-common" }
ap-declination = { path = "crates/ap-declination" }
ap-ekf3 = { path = "crates/ap-ekf3" }
ap-gps = { path = "crates/ap-gps" }
ap-gcs = { path = "crates/ap-gcs" }
ap-landing = { path = "crates/ap-landing" }
ap-logger = { path = "crates/ap-logger" }
ap-ins = { path = "crates/ap-ins" }
ap-sim = { path = "crates/ap-sim" }
ap-scheduler = { path = "crates/ap-scheduler" }
ap-replay = { path = "crates/ap-replay" }
ap-tecs = { path = "crates/ap-tecs" }
ap-vtol-assist = { path = "crates/ap-vtol-assist" }
ap-quadplane = { path = "crates/ap-quadplane" }
ap-wpnav = { path = "crates/ap-wpnav" }
ap-precland = { path = "crates/ap-precland" }

# ADR-0004 decision 1: upstream builds -fno-exceptions. There is no unwinding
# to reproduce, and a panic in flight code is a bug rather than control flow.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# Note: cargo ignores `panic` for the test profile - tests always unwind so
# failures can be reported. Setting it there produces a warning, so we do not.

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Upstream runs on hardware with no allocator on the flight path.
# These catch accidental drift toward std/alloc behavior.
float_cmp = "warn"
indexing_slicing = "warn"
