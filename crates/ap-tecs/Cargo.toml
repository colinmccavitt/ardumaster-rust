[package]
name = "ap-tecs"
description = "Port of ArduPilot libraries/AP_TECS (Plane-4.7.0). Tracked as FW-015."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ap-hal = { workspace = true }
ap-math = { workspace = true }
ap-filter = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
# self-dependency so the crate's own tests get the `replay` feature
ap-tecs = { path = ".", features = ["replay"] }
ap-replay = { workspace = true }

[lints]
workspace = true

[features]
# Exposes `Tecs::seed_for_replay`, used only by the log-replay tests to start a
# segment from the state upstream actually had. Never enabled in a flight build.
replay = []
