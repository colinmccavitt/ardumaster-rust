[package]
name = "ap-control"
description = "Port of ArduPilot libraries/APM_Control fixed-wing controllers (Plane-4.7.0). Tracked as FW-017."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ap-math = { workspace = true }
libm = { workspace = true }
ap-pid = { workspace = true }
ap-param = { workspace = true }

[dev-dependencies]
libm = { workspace = true }
# self-dependency so the crate's own tests get the `replay` feature
ap-control = { path = ".", features = ["replay"] }
ap-replay = { workspace = true }
ap-pid = { workspace = true }
ap-param = { workspace = true }

[lints]
workspace = true

[features]
# Exposes `SteerController::seed_for_replay`, used only by the log-replay test
# to start each step from the state upstream actually had. Never enabled in a
# flight build.
replay = []
