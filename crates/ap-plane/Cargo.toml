[package]
name = "ap-plane"
description = "Port of ArduPlane vehicle glue (Plane-4.7.0). Tracked as FW-025."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ap-landing = { workspace = true }
ap-math = { workspace = true }

[dev-dependencies]
# The first test that composes ported modules rather than checking one alone.
ap-control = { workspace = true }
ap-landing = { workspace = true }
ap-math = { workspace = true, features = ["ekf-double"] }
ap-nav = { workspace = true, features = ["replay"] }
ap-pid = { workspace = true }
ap-replay = { workspace = true }
ap-servo = { workspace = true }

[lints]
workspace = true
